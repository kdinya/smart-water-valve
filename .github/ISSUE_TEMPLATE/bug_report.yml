name: Bug report
description: Something in the card isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: A clear description of the problem. What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Card configuration (YAML)
      description: Paste your card's YAML config. Replace real entity ids/secrets with placeholders if you'd rather not share them.
      render: yaml
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Card version
      description: From the browser console log line, e.g. "WATER-VALVE-CARD 5.0.6"
      placeholder: "5.0.6"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.0"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device / screen size
      options:
        - Phone
        - Tablet
        - Desktop browser
        - More than one of these
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: For layout/visual issues, a screenshot makes this much faster to diagnose.

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open DevTools (F12) → Console, and paste anything relevant (red text).
      render: text
